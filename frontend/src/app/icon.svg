<!-- The brand mark in a badge, the form a browser tab can still read at 16px.
     Next serves this file as the favicon by its name and location, so there is
     no <link rel="icon"> to keep in sync. One colour rather than the in-app
     duet, because a tab strip can be light or dark and the two-tone mark loses
     its base tier on the dark one. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <rect width="96" height="96" rx="22" fill="#1b4dff" />
  <g fill="#ffffff" transform="translate(48 49) scale(0.8) translate(-48 -49)">
    <rect x="28" y="10" width="7" height="24" />
    <rect x="61" y="10" width="7" height="24" />
    <rect x="28" y="18.5" width="40" height="7" />
    <rect x="16" y="40" width="64" height="7" />
    <rect x="44.5" y="47" width="7" height="11" />
    <rect x="8" y="64" width="80" height="7" />
    <rect x="44.5" y="71" width="7" height="17" />
  </g>
</svg>
