server:
  port: ${PORT:8080}

spring:
  application:
    name: template-api
  flyway:
    # Flyway keeps its own history table. A database that already holds these
    # tables — and an earlier migration runner's `schema_migrations` history —
    # but has no Flyway history would normally be refused; baseline-on-migrate
    # records a baseline instead. Every statement in the migration is
    # IF NOT EXISTS, so either path is a no-op against a migrated database.
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  # Environment variables, not Spring profiles, so an existing .env / .env.dev
  # keeps working unchanged. See EnvFiles for the precedence rules.
  env: ${NODE_ENV:development}
  database-url: ${DATABASE_URL:postgres://postgres:postgres@localhost:5432/template-db?sslmode=disable}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  jwt-secret: ${JWT_SECRET:}
  smtp-host: ${SMTP_HOST:}
  smtp-port: ${SMTP_PORT:587}
  smtp-user: ${SMTP_USER:}
  smtp-pass: ${SMTP_PASS:}
  mail-from: ${MAIL_FROM:tom.tran@email.com}
  max-attempts: ${MAX_ATTEMPTS:3}
  email-verification-required: ${EMAIL_VERIFICATION_REQUIRED:true}
